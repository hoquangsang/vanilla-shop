<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vanilla Shop: your search, shown on the detail page." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Detail | Vanilla Shop</title>
  </head>
  <body data-page="detail" class="bg-white font-sans text-ink antialiased">
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:bg-white focus:px-4 focus:py-2 focus:text-primary"
      >Skip to content</a
    >
    <!-- @include partials/header.html -->
    <main id="main">
      <!-- region:detail -->
      <section class="container-page pt-8 pb-24" aria-labelledby="detail-title">
        <h1 id="detail-title" class="sr-only">Search detail</h1>
        <label for="detail-text" class="sr-only">Your search keyword</label>
        <textarea
          id="detail-text"
          data-detail-text
          rows="7"
          placeholder="Nothing searched yet. Use the search box above."
          class="h-[170px] min-h-[170px] w-full resize-y rounded-sm border border-black/15 p-4 placeholder:text-ink-muted focus-visible:border-primary focus-visible:ring-1 focus-visible:ring-primary focus-visible:outline-none lg:w-1/2"
        ></textarea>
      </section>
    </main>
    <!-- @include partials/footer.html -->
    <script type="module" src="/src/pages/detail.ts"></script>
  </body>
</html>
